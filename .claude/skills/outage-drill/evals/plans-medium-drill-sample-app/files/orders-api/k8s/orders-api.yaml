apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api
data:
  PAYMENTS_URL: http://payments:8080
  PAYMENTS_TIMEOUT_SECONDS: "2"
  PAYMENTS_RETRIES: "1"
  ORDER_CACHE_TTL_SECONDS: "60"
  ORDER_CACHE_MAX_ENTRIES: "5000"
  MAX_CONCURRENT_CHARGES: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: registry.example.internal/orders-api:1.4.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - port: 8080
      targetPort: 8080
